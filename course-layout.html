<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Session outline for the Absolute Beginner's Web Development Course.">
    <meta name="theme-color" content="#000000">
    <meta name="author" content="Coding Club IISER Thiruvananthapuram">
    <title>Course Layout - Coding Club IISER Thiruvananthapuram</title>

    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="console.css" rel="stylesheet">
</head>
<body>

<div class="deck" data-deck data-page="webdev-course.html" data-title="Slides">
    <div class="screen" data-screen>
        <div class="glass" aria-hidden="true"></div>

        <section class="hero" data-name="Course Layout">
            <div class="wrap">
                <p class="hero__desig">CCIT &middot; MATERIALS</p>
                <h1 class="hero__title">Course Layout</h1>
                <p class="hero__lede">The full session-by-session outline for the Absolute Beginner's Web Development Course. Sixteen slides, use the arrows or your keyboard.</p>
                <div class="hero__actions"><a class="btn btn--go" href="webdev-course.html">Course details <i class="fas fa-arrow-right"></i></a><a class="btn" href="projects.html">All courses</a></div>
            </div>
        </section>

        <section class="sec" id="slides" data-name="Slides">
            <div class="wrap">
                <div class="sec__head">
                    <div class="divider"><span class="lbl">Panel A &middot; Curriculum</span></div>
                    <h2 class="sec__title">Outline</h2>
                    
                </div>
                <div class="viewer">
                    <div class="viewer__stage">
                        <img id="slide" src="Absolute Beginner's Web Development Course/1.svg" alt="Course slide 1">
                    </div>
                    <div class="viewer__bar">
                        <button class="btn" id="prev"><i class="fas fa-arrow-left"></i> Prev</button>
                        <span class="mono" id="counter">01 / 16</span>
                        <button class="btn" id="next">Next <i class="fas fa-arrow-right"></i></button>
                    </div>
                    <div class="viewer__pips">
                    <button class="slide__pip is-on" data-go="1" aria-label="Slide 1">01</button>
                    <button class="slide__pip" data-go="2" aria-label="Slide 2">02</button>
                    <button class="slide__pip" data-go="3" aria-label="Slide 3">03</button>
                    <button class="slide__pip" data-go="4" aria-label="Slide 4">04</button>
                    <button class="slide__pip" data-go="5" aria-label="Slide 5">05</button>
                    <button class="slide__pip" data-go="6" aria-label="Slide 6">06</button>
                    <button class="slide__pip" data-go="7" aria-label="Slide 7">07</button>
                    <button class="slide__pip" data-go="8" aria-label="Slide 8">08</button>
                    <button class="slide__pip" data-go="9" aria-label="Slide 9">09</button>
                    <button class="slide__pip" data-go="10" aria-label="Slide 10">10</button>
                    <button class="slide__pip" data-go="11" aria-label="Slide 11">11</button>
                    <button class="slide__pip" data-go="12" aria-label="Slide 12">12</button>
                    <button class="slide__pip" data-go="13" aria-label="Slide 13">13</button>
                    <button class="slide__pip" data-go="14" aria-label="Slide 14">14</button>
                    <button class="slide__pip" data-go="15" aria-label="Slide 15">15</button>
                    <button class="slide__pip" data-go="16" aria-label="Slide 16">16</button>
                    </div>
                </div>
            </div>
        </section>

        <section class="sec" data-name="Comms">
            <div class="wrap">
                <div class="foot">
                    <img src="connection_network_infinity_partial_logo.png" alt="">
                    <span>Coding Club &middot; IISER Thiruvananthapuram</span>
                    <span class="lbl">Built by members</span>
                </div>
            </div>
        </section>

    </div>
</div>

<script src="console.js"></script>
<script>
(function () {
  var DIR = "Absolute Beginner's Web Development Course";
  var n = 1, TOTAL = 16;
  var img = document.getElementById('slide');
  var counter = document.getElementById('counter');
  var pips = document.querySelectorAll('.slide__pip');
  var pad = function (v) { return (v < 10 ? '0' : '') + v; };

  function show(i) {
    n = ((i - 1 + TOTAL) % TOTAL) + 1;
    img.src = DIR + '/' + n + '.svg';
    img.alt = 'Course slide ' + n;
    counter.textContent = pad(n) + ' / ' + TOTAL;
    pips.forEach(function (p, k) { p.classList.toggle('is-on', k + 1 === n); });
  }

  document.getElementById('prev').onclick = function () { show(n - 1); };
  document.getElementById('next').onclick = function () { show(n + 1); };
  pips.forEach(function (p) {
    p.onclick = function () { show(+p.dataset.go); };
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowLeft') show(n - 1);
    if (e.key === 'ArrowRight') show(n + 1);
  });
})();
</script>
</body>
</html>
